{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "sentinel.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # SQL Server, Redis, model endpoint, Entra ID metadata (443)
    {{- range .Values.networkPolicy.egress }}
    - ports:
        {{- range .ports }}
        - { port: {{ .port }}, protocol: TCP }
        {{- end }}
    {{- end }}
{{- end }}
